name: release

# [ES4] Publishes ElecSus to PyPI, as `elecsus4`, when a GitHub release is
# published (a pre-release too). The release's tag must be "v" and the version
# in pyproject.toml, e.g. v4.0.0b1. It uses PyPI's trusted publishing, so no
# token is stored anywhere: PyPI accepts the upload because it trusts this
# workflow file, run in the GitHub environment `pypi`, of this repository.
# Run it by hand (Actions > release > Run workflow) to build and check the
# release without publishing it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'durham-qlm/ElecSus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag is the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag $TAG, version $version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the release's tag $TAG is not v$version, the version in pyproject.toml"
            exit 1
          fi
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean venv and validate it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "$(ls dist/*.whl)[test]"
          cd "$RUNNER_TEMP"
          MPLBACKEND=Agg "$PY" -m elecsus.validate --no-figures
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/elecsus4/
    permissions:
      id-token: write      # for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
