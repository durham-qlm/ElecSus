name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # core deps from setup.py, plus the GUI stack (imported by the
          # test_gui_* suites) and pytest itself
          pip install -e .
          pip install pytest dash dash-bootstrap-components plotly
      - name: Run test suite
        run: python -m pytest -q
